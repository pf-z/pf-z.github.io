<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/assets/helio-DK77hCIK.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pf.zh's Log</title>
      <style>
          @media (max-width: 768px) {
              html {
                  font-size: 16px;
              }
          }
          @media (min-width: 769px) {
              html {
                  font-size: 16px;
              }
          }

          #global-loading {
              position: fixed;
              inset: 0;
              display: flex;
              flex-direction: column;      /* 外层竖排：点在上，文字在下 */
              align-items: center;
              justify-content: center;
              gap: 16px;
              background: #fff;
              z-index: 9999;
          }
          #global-loading .dots {
              display: flex;               /* 内层横排：三个点水平 */
              align-items: center;
          }
          #global-loading .dot {
              width: 12px;
              height: 12px;
              margin: 0 6px;
              border-radius: 50%;
              background: #3b82f6;
              animation: bounce 1.4s ease-in-out infinite;
          }
          @keyframes bounce {
              0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
              40% { transform: scale(1); opacity: 1; }
          }
          #global-loading .dot:nth-child(2) { animation-delay: 0.2s; }
          #global-loading .dot:nth-child(3) { animation-delay: 0.4s; }
          #global-loading span {
              font-size: 12px;
              color: #94a3b8;
              letter-spacing: 3px;
              text-transform: lowercase;
              margin-right: -3px;
              animation: breathe 1.6s ease-in-out infinite;
              font-family: Athelas, gara, STHeiti, Microsoft Yahei, serif;
          }
          @keyframes breathe {
              0%, 100% { opacity: 0.4; }
              50%      { opacity: 1; }
          }
      </style>
      <script>
          (function(){
              const redirect = sessionStorage.redirect;
              delete sessionStorage.redirect;
              if (redirect && redirect !== location.href) {
                  history.replaceState(null, null, redirect);
              }
          })();
      </script>
      <script
              type="text/javascript"
              id="MathJax-script"
              async
              src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
      ></script>
      <script>
          MathJax = {
              tex: {
                  inlineMath: [['$', '$'], ['$$', '$$']]
              }
          };
      </script>
    <script type="module" crossorigin src="/assets/index-BLgMk9T4.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-TN9-hk8Y.css">
  </head>
  <body>
    <div id="app">
      <div id="global-loading">
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <span>loading</span>
      </div>
    </div>
  </body>
</html>
