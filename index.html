<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/assets/helio-DK77hCIK.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengfei Zhang · Academic Homepage</title>

  <style>
      #global-loading {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          background: #fff;
          z-index: 9999;
      }

      #global-loading .dots {
          display: flex;
          align-items: center;
      }

      #global-loading .dot {
          width: 12px;
          height: 12px;
          margin: 0 6px;
          border-radius: 50%;
          background: #3b82f6;
          animation: bounce 1.4s ease-in-out infinite;
      }

      @keyframes bounce {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
          40% { transform: scale(1); opacity: 1; }
      }

      #global-loading .dot:nth-child(2) { animation-delay: 0.2s; }
      #global-loading .dot:nth-child(3) { animation-delay: 0.4s; }

      @media (prefers-color-scheme: dark) {
          #global-loading { background: #1d1f1c; }
      }
  </style>

  <script>
    (function () {
      var saved = localStorage.getItem('theme')
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    })()
  </script>

  <!-- MathJax 配置必须先于脚本加载 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['$$', '$$']]
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script>
    (function () {
      const redirect = sessionStorage.redirect
      delete sessionStorage.redirect
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect)
      }
    })()
  </script>
  <script type="module" crossorigin src="/assets/index-BqoId_ZO.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BiGv0e-a.css">
</head>

<body>
<div id="app">
  <div id="global-loading">
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>

<script>
  setTimeout(function () {
    var el = document.getElementById('global-loading')
    if (el) el.style.display = 'none'
  }, 5000)
</script>

</body>
</html>
