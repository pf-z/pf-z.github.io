<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/assets/helio-DK77hCIK.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengfei Zhang - Modeling Social Systems Through Networks and Dynamics</title>

  <style>
      #global-loading {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #ffffff;
          color: #0f172a;
          /* 强制使用绝对单位 px，彻底避免依赖 html 根节点的 rem 抖动 */
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          font-size: 16px;
          font-weight: 600;
          line-height: 1;
          z-index: 9999;
          user-select: none;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
      }

      #global-loading .terminal-loader {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          height: 24px;
          box-sizing: border-box;
      }

      #global-loading .symbol {
          color: #10b981;
          font-weight: 700;
          line-height: 1;
      }

      #global-loading .text {
          color: #64748b;
          letter-spacing: -0.01em;
          line-height: 1;
          text-transform: lowercase;
      }

      /* 动态循环的三个点（用 px 锁死宽度） */
      #global-loading .dots::after {
          content: '';
          display: inline-block;
          width: 24px;
          text-align: left;
          animation: loading-dots 1.5s steps(4, end) infinite;
      }

      @keyframes loading-dots {
          0%   { content: ''; }
          25%  { content: '.'; }
          50%  { content: '..'; }
          75%  { content: '...'; }
          100% { content: ''; }
      }

      /* 闪烁光标（全部换成固定的 px） */
      #global-loading .cursor {
          display: inline-block;
          width: 11px;
          height: 16px;
          background: #06b6d4;
          margin-left: 2px;
          animation: blink 0.8s steps(2, start) infinite;
          flex-shrink: 0;
      }

      @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
      }

      @media (prefers-color-scheme: dark) {
          #global-loading {
              background: #0f172a;
              color: #f8fafc;
          }
          #global-loading .text {
              color: #94a3b8;
          }
          #global-loading .cursor {
              background: #22d3ee;
          }
      }
  </style>

  <script>
    (function () {
      var saved = localStorage.getItem('theme')
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'))
    })()
  </script>

  <!-- MathJax 配置必须先于脚本加载 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['$$', '$$']]
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script>
    (function () {
      const redirect = sessionStorage.redirect
      delete sessionStorage.redirect
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect)
      }
    })()
  </script>
  <script type="module" crossorigin src="/assets/index-DyrPq-pu.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BIimrRLn.css">
</head>

<body>
<div id="app">
  <div id="global-loading">
    <div class="terminal-loader">
      <span class="symbol">::</span>
      <span class="text">loading<span class="dots"></span></span>
      <span class="cursor"></span>
    </div>
  </div>
</div>

</body>
</html>
